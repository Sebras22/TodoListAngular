<header class="sidebarHeader">
  <div class="topSection">
    <h1 class="rolling-title">
      <span style="--i: 0">M</span>
      <span style="--i: 1">y</span>
      <span class="space" style="--i: 2">&nbsp;</span>
      <span style="--i: 3">B</span>
      <span style="--i: 4">o</span>
      <span style="--i: 5">a</span>
      <span style="--i: 6">r</span>
      <span style="--i: 7">d</span>
      <span style="--i: 8">s</span>
    </h1>
    <div class="boardsList">
      @for (board of boards(); track board.id) {
        <app-board [name]="board.name" [id]="board.id" (delete)="onDeleteBoard(board.id)" />
      } @empty {
        <p class="empty-state">No boards available at the moment.</p>
      }
    </div>
  </div>
  <div class="bottomSection">
    <div class="actionButtons">
      <app-board-creation />
      <button type="button" class="btn-share" (click)="copyGithubLink()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="btn-icon"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M6 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
          <path d="M18 6m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
          <path d="M18 18m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
          <path d="M8.7 10.7l6.6 -3.4" />
          <path d="M8.7 13.3l6.6 3.4" />
        </svg>
        <span>Share project</span>
      </button>
      <button type="button" class="btn-github" (click)="goToGithub()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="btn-icon"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path
            d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5"
          />
        </svg>
        <span>Github Link</span>
      </button>
    </div>
  </div>
</header>
