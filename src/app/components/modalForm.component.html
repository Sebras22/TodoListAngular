<h2 mat-dialog-title>
  {{ isBoard ? 'New Board' : 'New Task' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" id="modalForm" (ngSubmit)="onSubmit()">
    <div class="form-field">
      <label for="title">
        {{ isBoard ? 'Board Name' : 'Task Title' }}
      </label>
      <input
        id="title"
        type="text"
        formControlName="title"
        [placeholder]="isBoard ? 'Enter board name...' : 'Enter task title...'"
      />
      @if (form.controls.title.touched && form.controls.title.invalid) {
        <span class="error-text">
          {{ isBoard ? 'The name' : 'The title' }} must contain at least 3 characters.
        </span>
      }
    </div>

    @if (!isBoard) {
      <div class="form-field">
        <label for="description">Description</label>
        <textarea
          id="description"
          formControlName="description"
          rows="3"
          placeholder="Optional details..."
        ></textarea>
      </div>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
  <button type="submit" form="modalForm" class="btn-primary" [disabled]="form.invalid">Save</button>
</mat-dialog-actions>
